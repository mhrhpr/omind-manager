services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: omind
      POSTGRES_USER: omind
      POSTGRES_PASSWORD: omind
    ports:
      - '5432:5432'
    volumes:
      - omind-postgres:/var/lib/postgresql/data

  api:
    build: .
    environment:
      OMIND_DATABASE_URL: postgresql+psycopg://omind:omind@postgres:5432/omind
      OMIND_OBJECT_STORAGE_DIR: /app/storage
    ports:
      - '8000:8000'
    volumes:
      - ./storage:/app/storage
    depends_on:
      - postgres

volumes:
  omind-postgres:
