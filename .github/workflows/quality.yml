name: OMIND Quality Gate

on:
  push:
    branches: [main, feat/omind-production-foundation, feat/omind-reasoning-core, feat/omind-phase-3-platform, feat/omind-phase-4-productization, feat/omind-production-hardening]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm install
      - run: npm run quality

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: python -m compileall -q app tests
        working-directory: backend
      - run: pytest -q
        working-directory: backend
      - run: alembic check
        working-directory: backend
